# ═══════════════════════════════════════════════════════════════════════════
# DUUI Formal Design Specification
# ═══════════════════════════════════════════════════════════════════════════

meta:
  version: "2.0.0"
  date: "2026-06-25"
  principle: |
    Everything is a trait. Entities compose traits. DUUIEntity<T extends DUUITrait>
    is the single base class with shallow inheritance (DUUIEntity → DUUIManager).
    Clients are UNCHANGED. Managers are added ON TOP to centralize creation and
    emit sealed DUUIHandle subtypes. All creation is centralized (Managers via
    DUUIOrchestrator config, managed entities via factories). Lifecycle via
    @Phase. Telemetry via composable DUUIProfile with dot-separated namespacing.
    DUUIScope<T> for try-with-resources builder scoping.

# ═══════════════════════════════════════════════════════════════
# 1. TRAIT SYSTEM
# ═══════════════════════════════════════════════════════════════

traits:
  DUUITrait:
    description: "Root of ALL behavioural contracts."
    families:
      DUUIBehaviour:       "Loggable, Measurable, Traceable, Observable, Profilable, Versionable, Attributable, Indexable, Cacheable"
      DUUIProtocol:        "HTTP, gRPC, UIMA, Streaming, MessagePack, Lua, XMI, JSON, FileSystem, ContainerRuntime, WebSocket, DUUIEndpoint"
      DUUISpecification:   "Identity, Address, Resource, Capability, Contract, MetricSpec, Endpoint, Image, Scale"
      DUUIPolicy:          "FailurePolicy, RetryPolicy, QuarantinePolicy, RateLimitPolicy, TimeoutPolicy, AdmissionPolicy, CircuitBreakerPolicy, ConcurrencyPolicy"
      DUUIStrategy:        "SchedulingStrategy, RoutingStrategy, LoadBalancing, BackoffStrategy, CachingStrategy, DiscoveryStrategy"
      DUUILifecycle:       "Creatable, Startable, Pausable, Stoppable, Restartable, Disposable, Failable, Retryable"
      DUUIConcurrency:     "SingleThreaded, ThreadBound, Slot, Pooled, Unbounded, Virtual, Platform, Serialized, Partitioned"

# ═══════════════════════════════════════════════════════════════
# 2. ENTITY BASE CLASSES — SHALLOW INHERITANCE
# ═══════════════════════════════════════════════════════════════

entity:
  DUUIEntity<T extends DUUITrait>:
    description: "SINGLE base class for ALL domain objects."
    framework_managed:
      - gid, traits, profile, timeline, lifecycleState (AtomicReference<String>)
      - logger, primaryTraitClass (erasure-safe)
    methods:
      - "has(Class): boolean — runtime trait check"
      - "get(Class): Optional<T> — retrieve trait"
      - "is(Class): boolean — erasure-safe via primaryTraitClass"
      - "describe(): DUUIDescription — auto from traits"
      - "builder(): DUUIBuilder — from description"
      - "configuration(): DUIConfiguration<T> — validated snapshot"
      - "wrap(Consumer<PhaseWrapper>, Supplier<R>): R — lambda injection hooks"
    lifecycle:
      - "doInitialize/doStart/doStop/doDispose create DUUIPhase in timeline"
      - "validTransitions(): CREATED→INITIALIZING→READY→STARTING→RUNNING→STOPPING→STOPPED→DISPOSING→DISPOSED"

  DUUIManager<T extends DUUITrait, H extends DUUIHandle> extends DUUIEntity<T>:
    description: "Runtime SINGLETONS. Initialized by DUUIOrchestrator from config. Emit a sealed DUUIHandle."
    singleton: "ConcurrentHashMap<Class<?>, DUUIManager<?,?>> — putIfAbsent in constructor"
    contract:
      - "handle(): H — sealed handle this manager emits"
      - "initialize(Object runtime): void — called once by DUUIOrchestrator"
      - "shutdown(): void"
      - "health(): DUUIResourceUseSnapshot"
    static:
      - "instance(Class<M>): M — retrieve singleton"
      - "exists(Class): boolean"

# ═══════════════════════════════════════════════════════════════
# 3. CREATION — CENTRALIZED, TWO-TIER
# ═══════════════════════════════════════════════════════════════

creation:
  principle: |
    ALL creation and management is centralized. Either the entity is a MANAGER
    (initialized through DUUIOrchestrator configuration) OR it's a MANAGED
    ENTITY (created ONLY through factories, lifecycle via @Phase methods).

  DUUIOrchestrator:
    description: "Central orchestrator — initializes all DUUIManager singletons from config."
    contract:
      - "initializeManager(M): M — register a manager"
      - "managers(): List<DUUIManager<?,?>>"
      - "managerByHandle(Class<H>): Optional<DUUIManager<?,H>>"
      - "shutdown(): void — reverse-order shutdown"

  managers:
    description: "Runtime singletons initialized by DUUIOrchestrator."
    instances:
      - "DUUITelemetryService     → DUUIManager<Observable & Measurable & Traceable, DUUIHandle>"
      - "DUUIEntityRegistry       → DUUIManager<Indexable & Observable, DUUIHandle>"
      - "DUUIEndpointManager      → DUUIManager<HTTP & Observable & Measurable, DUUIHandle.Endpoint>"
      - "DUUIContainerManager     → DUUIManager<ContainerRuntime & Observable & Measurable, DUUIHandle.Container>"
      - "DUUIFileSystemManager    → DUUIManager<FileSystem & Observable & Measurable, DUUIHandle.FileSystem>"
      - "DUUIDatabaseManager      → DUUIManager<Observable & Measurable, DUUIHandle.Database>"
      - "DUUIHttpClientManager    → DUUIManager<HTTP & RateLimitPolicy & Observable & Measurable, DUUIHandle.HttpClient>"
      - "DUUIScheduler            → DUUIManager<SchedulingStrategy & Measurable & Observable, DUUIHandle>"
      - "DUUIExecutorService      → DUUIManager<Pooled & Virtual & Measurable & Observable, DUUIHandle>"

  managed_entities:
    description: "Created ONLY through factories. Lifecycle via @Phase."
    examples:
      - "DUUIAnnotator<H> — created by DUUIV1Driver or DUUIUIMADriver"
      - "DUUIComponent<H,C,A> — created by ComponentFactory"
      - "DUUIPipeline — created by PipelineBuilder.build()"

# ═══════════════════════════════════════════════════════════════
# 4. SEALED HANDLE HIERARCHY
# ═══════════════════════════════════════════════════════════════

handles:
  DUUIHandle:
    description: "SEALED interface — ALL DUUIManager instances emit from this hierarchy. Compiler knows every subtype."
    subtypes:
      Endpoint:        "(GID gid, URI uri, HttpClient client) — raw URL OR container projection"
      AnalysisEngine:  "(GID gid, AnalysisEngine engine) — UIMA in-process"
      FileSystem:      "(GID gid, Path root, boolean local)"
      Container:       "(GID gid, String image, String containerId)"
      Database:        "(GID gid, String url, String driver)"
      HttpClient:      "(GID gid, HttpClient client)"
      Process:         "(GID gid, long pid, String name)"

# ═══════════════════════════════════════════════════════════════
# 5. CLIENT HIERARCHY — UNCHANGED, MANAGERS ADDED ON TOP
# ═══════════════════════════════════════════════════════════════

clients:
  principle: |
    Clients are UNCHANGED from the original DUUI design. Managers are a NEW
    layer added ON TOP to centralize creation and emit sealed handles.
    Every client still operates through its handle. Every manager wraps
    creation of its client type.

  # ── Root contracts ───────────────────────────────────────────
  DUUIClient<H extends DUUIHandle>:
    description: "Top-level client contract. Operates through a sealed handle."
    extends: "DUUIService"
    contract:
      - "handle(): H — sealed handle this client uses"
      - "auth(): Object — authentication record"
      - "shutdown(): void"

  # ── Filesystem clients (unchanged hierarchy) ─────────────────
  filesystem:
    DUUIFileSystemClient:
      description: "Filesystem contract — all FS operations @Phase-annotated."
      extends: "DUUIClient<DUUIHandle.FileSystem>, AutoCloseable"
      phases:
        - "@Phase(V1_FILE_READ)  metadata(DUUILocator): DUUIFileMetadata"
        - "@Phase(V1_FILE_READ)  file(DUUILocator): DUUIFile"
        - "@Phase(V1_FILE_READ)  directory(DUUILocator): DUUIDirectory"
        - "@Phase(V1_FILE_READ)  explorer(DUUILocator): DUUIExplorer"
        - "@Phase(V1_FILE_READ)  read(DUUILocator): byte[]"
        - "@Phase(V1_FILE_WRITE) write(DUUILocator, byte[]): void"
        - "@Phase(V1_FILE_READ)  list(DUUILocator): List<DUUIFileMetadata>"
      yaml: |
        filesystem:
          provider: LOCAL_FS | S3 | MINIO | GOOGLE_DRIVE | DROPBOX | NEXTCLOUD | MONGO_GRIDFS
          root: /data or s3://bucket
          readOnly: false
    providers:
      DUUILocalFSClient:
        extends: "DUUIFileSystemClient"
        phases: "@Phase on read, write, list, discover, traverse, delete"
        yaml: |
          localfs:
            provider: LOCAL_FS
            root: /data
      DUUIS3Client:
        extends: "DUUIFileSystemClient"
        phases: "@Phase on read, write, list, traverse"
        yaml: |
          s3:
            provider: S3
            bucket: my-bucket
            region: us-east-1
      DUUIMinIOClient:
        extends: "DUUIFileSystemClient"
        phases: "@Phase on read, write, list, traverse"
        yaml: |
          minio:
            provider: MINIO
            bucket: my-bucket
            endpoint: http://minio:9000
      DUUIGoogleDriveClient:
        extends: "DUUIFileSystemClient"
        phases: "@Phase on read, write, list, traverse"
        yaml: |
          googledrive:
            provider: GOOGLE_DRIVE
            credentials: /secrets/gdrive.json
      DUUIDropboxClient:
        extends: "DUUIFileSystemClient"
        phases: "@Phase on read, write, list, traverse"
        yaml: |
          dropbox:
            provider: DROPBOX
            token: ${DROPBOX_TOKEN}
      DUUINextCloudClient:
        extends: "DUUIFileSystemClient"
        phases: "@Phase on read, write, list, traverse"
        yaml: |
          nextcloud:
            provider: NEXTCLOUD
            endpoint: https://nc.example.com
      DUUIMongoGridFSClient:
        extends: "DUUIFileSystemClient"
        phases: "@Phase on read, write, list, traverse"
        yaml: |
          mongogridfs:
            provider: MONGO_GRIDFS
            uri: mongodb://localhost:27017
            database: duui

  # ── Virtualization clients (unchanged hierarchy) ─────────────
  virtualization:
    DUUIVirtualizationClient:
      extends: "DUUIClient"
      description: "Abstract base for container runtime clients."
      phases: "@Phase on pull, create, start, stop, remove"
      yaml: |
        virtualization:
          kind: DOCKER | PODMAN | KUBERNETES | SWARM
          socket: unix:///var/run/docker.sock
    runtimes:
      DUUIDockerClient:
        extends: "DUUIVirtualizationClient"
        phases: "@Phase on pullImage, createContainer, startContainer, stopContainer, removeContainer"
        yaml: |
          docker:
            engine: docker
            registry: docker.io
      DUUIPodmanClient:
        extends: "DUUIVirtualizationClient"
        phases: "@Phase on pullImage, createContainer, startContainer, stopContainer, removeContainer"
        yaml: |
          podman:
            engine: podman
            rootless: true
      DUUIKubernetesClient:
        extends: "DUUIVirtualizationClient"
        phases: "@Phase on ensureImage, createDeployment, waitReady, deleteDeployment"
        yaml: |
          kubernetes:
            engine: kubernetes
            namespace: duui
      DUUISwarmClient:
        extends: "DUUIVirtualizationClient"
        phases: "@Phase on pullImage, deployService, removeService"
        yaml: |
          swarm:
            engine: swarm
            network: overlay

  # ── HTTP client (unchanged) ──────────────────────────────────
  http:
    DUUIHttpClient:
      extends: "DUUIClient<DUUIHandle.HttpClient>"
      phases:
        - "@Phase(V1_SERIALIZE_REQUEST) get(URI, Map<String,String>): DUUIHttpResponse"
        - "@Phase(V1_ANALYSE_REQUEST) post(URI, byte[], Map<String,String>): DUUIHttpResponse"
      yaml: |
        http:
          baseUri: http://localhost:8080
          timeout: 30s

  # ── Database clients (unchanged hierarchy) ───────────────────
  database:
    DUUIDatabaseClient:
      extends: "DUUIClient<DUUIHandle.Database>"
      phases:
        - "@Phase(V1_CONTAINER_CREATE) connect(): void"
        - "@Phase(V1_SERIALIZE_REQUEST) execute(String): void"
        - "@Phase(V1_DESERIALIZE_REQUEST) query(String): List"
      yaml: |
        database:
          kind: SQLITE
          url: jdbc:sqlite:/data/duui.db
    DUUISqliteClient:
      extends: "DUUIDatabaseClient"
      phases: "@Phase on connect, executeUpdate, query"
      yaml: |
        sqlite:
          kind: SQLITE
          path: /data/duui.db
          wal: true

  # ── Telemetry profiler clients (unchanged hierarchy) ─────────
  telemetry:
    DUUIProfilerClient:
      extends: "DUUIClient"
      description: "Profiler contract (interface)."
      yaml: |
        profiler:
          kind: JFR | MXBEAN | PROMETHEUS
          enabled: true
    DUUIAbstractProfilerClient:
      extends: "DUUIProfilerClient"
      description: "Abstract base with common logic."
    DUUIJfrClient:
      extends: "DUUIAbstractProfilerClient"
      phases: "@Phase on startRecording, stopRecording"
      yaml: |
        jfr:
          settings: profile
          maxSize: 250MB
    DUUIMxBeanClient:
      extends: "DUUIAbstractProfilerClient"
      phases: "@Phase on collectMetrics"
      yaml: |
        jmx:
          domains: [java.lang, java.nio]
    DUUIPrometheusClient:
      extends: "DUUIAbstractProfilerClient"
      phases: "@Phase on pushMetrics, exportMetrics"
      yaml: |
        prometheus:
          pushGateway: http://pushgateway:9091
          job: duui

# ═══════════════════════════════════════════════════════════════
# 6. BUILDER SYSTEM — DUUIScope<T>, CHAINING, SUB-BUILDERS
# ═══════════════════════════════════════════════════════════════

builders:
  principle: |
    A SINGLE DUUIScope<T> type works for ALL builders (try-with-resources).
    Builders can initiate sub-builders for sub-entities. Context-based
    attachment composes builders. DUUIScope provides automatic cleanup.

  DUUIScope<T extends AutoCloseable>:
    description: "Generic RAII scope — single type for all builders."
    usage: |
      try (var scope = DUUIPipeline.scope()) {
          var pipeline = scope.resource()
              .v1("tokenizer").endpoint("http://tok:8080").add()
              .v1("ner").image("ner:latest").docker().scale(4).add()
              .build();
          pipeline.run();
      }

  PipelineBuilder:
    description: "Fluent builder for DUUIPipeline. Supports sub-builder chaining."
    scope_entry: "DUUIPipeline.scope() → DUUIScope<PipelineBuilder>"
    sub_builders:
      - "v1(String id): DUUIV1ComponentBuilder — initiate V1 component sub-builder"
      - "uima(String id): DUUIUimaComponentBuilder — initiate UIMA component sub-builder"
    chaining: |
      PipelineBuilder.v1("name") → DUUIV1ComponentBuilder
        .endpoint(url) / .image(img) / .docker() / .podman() / .kubernetes() / .swarm()
        .scale(n) / .concurrency(n) / .timeout(d) / .retry(n,d) / .gpu(bool)
        .add() → returns to PipelineBuilder

  DUUIV1ComponentBuilder:
    description: "Sub-builder for V1 annotator components."
    methods:
      - "endpoint(String): self"
      - "image(String): self"
      - "docker() / podman() / kubernetes() / swarm() / remote(): self"
      - "scale(int): self"
      - "concurrency(int): self"
      - "view(String src, String tgt): self"
      - "parameter(String k, String v): self"
      - "header(String k, String v): self"
      - "timeout(Duration): self"
      - "retry(int tries, Duration delay): self"
      - "gpu(boolean): self"
      - "add(): PipelineBuilder — return to parent"

  DUUIUimaComponentBuilder:
    description: "Sub-builder for in-process UIMA components."
    methods:
      - "engine(AnalysisEngine): self"
      - "scale(int): self"
      - "add(): PipelineBuilder"

# ═══════════════════════════════════════════════════════════════
# 7. PROFILE SYSTEM — COMPOSABLE, NAMESPACED
# ═══════════════════════════════════════════════════════════════

profile:
  principle: |
    DUUIResourceSpecifier allows entities to specify telemetry instruments
    and specs for resources they want tracked. All collected into DUUIProfile.
    DUUIProfile composes sub-profiles hierarchically. During telemetry
    observation and scheduler analysis, the profile is a TRANSPARENT WINDOW
    to entity resource costs. All normalized via dot-separated namespacing.

  DUUIProfile:
    description: "Immutable specification surface. Composes sub-profiles."
    operations:
      - "forEntity(DUUIEntity): DUUIProfile — factory"
      - "merge(DUUIProfile): DUUIProfile — hierarchical, subordinate wins"
      - "subProfiles(): List<DUUIProfile>"
      - "flatten(): DUUIProfile — normalized dot-separated namespace"
    namespacing: |
      entity.<id>.cpu.utilization
      entity.<id>.memory.heap.used
      entity.<id>.component.<cid>.replica.<n>.latency.p99
      pipeline.<pid>.stage.<sid>.throughput.ops_per_sec

  DUUIResourceSpecifier:
    description: "Trait — entities declare instruments and resource specs."
    contract:
      - "resourceSpecs(): List<ResourceSpec>"
      - "telemetryInstruments(): List<InstrumentSpec>"
    scheduler_transparency: |
      Scheduler reads flattened DUUIProfile as Map<String,Double>.
      Decisions based on profile comparison — no entity internals exposed.
      Objectives: MAXIMIZE_SUCCESS_YIELD, MAXIMIZE_PROGRESS,
      MINIMIZE_FAILURE_RATIO, MINIMIZE_LATENCY, MAXIMIZE_THROUGHPUT,
      CONSTRAIN_UTILIZATION (0.80 default), CONSTRAIN_SATURATION,
      CONSTRAIN_PRESSURE

# ═══════════════════════════════════════════════════════════════
# 8. TELEMETRY — AUTO-WIRED VIA TRAITS
# ═══════════════════════════════════════════════════════════════

telemetry_service:
  DUUITelemetryService:
    description: "Singleton — auto-scans registry for telemetry traits."
    auto_wiring:
      Measurable:   "For each metricName → create COUNTER"
      Observable:   "Create GAUGE for health"
      Traceable:    "Create SPAN for tracing"
      Loggable:     "Create COUNTER for log events"
    contract:
      - "autoInstrument(DUUIEntityRegistry): void"
      - "autoInstrument(DUUIEntity<?>): void"
      - "instruments(): Map<String, TelemetryInstrument>"
      - "addSink(DUUITelemetrySink): void"

# ═══════════════════════════════════════════════════════════════
# 9. END-TO-END EXAMPLE
# ═══════════════════════════════════════════════════════════════

example:
  yaml_config: |
    pipeline:
      id: biofid-nova
      stages:
        - component: tokenizer
          environment: docker
          image: docker.io/biofid/tokenizer:latest
          endpoint: http://tokenizer:8080
          scale: 4
          concurrency: 2
        - component: ner
          environment: kubernetes
          image: docker.io/biofid/ner:latest
          scale: 2
          gpu: true

  java_usage: |
    try (var scope = DUUIPipeline.scope("biofid-nova")) {
        var pipeline = scope.resource()
            .v1("tokenizer")
                .image("docker.io/biofid/tokenizer:latest")
                .endpoint("http://tokenizer:8080")
                .docker().scale(4).concurrency(2)
                .add()
            .v1("ner")
                .image("docker.io/biofid/ner:latest")
                .kubernetes().scale(2).gpu(true)
                .add()
            .build();

        pipeline.wrap(phase -> phase
            .before(() -> log.info("Starting"))
            .onFailure(e -> log.error("Failed", e)),
            pipeline::run);
    }
