syntax = "proto3";

package dua.transport.v1;

option java_package = "org.texttechnologylab.duui.dua.transport.grpc.v1";
option java_multiple_files = true;

service DuaTransport {
  rpc ImportXmi(ImportXmiRequest) returns (TransportJob);
  rpc ExportXmi(ExportXmiRequest) returns (TransportJob);
  rpc ImportTransfer(ImportTransferRequest) returns (TransportJob);
  rpc ExportTransfer(ExportTransferRequest) returns (TransportJob);
  rpc PatchCorpusMembership(PatchCorpusMembershipRequest) returns (TransportJob);
  rpc GetTransportJob(GetTransportJobRequest) returns (TransportJob);
}

message ImportXmiRequest {
  string universe_id = 1;
  string corpus_id = 2;
  string document_id = 3;
  string source_uri = 4;
  string target_archive_uri = 5;
}

message ExportXmiRequest {
  string transfer_uri = 1;
  string document_id = 2;
  string target_uri = 3;
}

message ImportTransferRequest {
  string universe_id = 1;
  string corpus_id = 2;
  string transfer_uri = 3;
  string target_archive_uri = 4;
}

message ExportTransferRequest {
  string target_uri = 1;
  repeated TransferDocument documents = 2;
}

message PatchCorpusMembershipRequest {
  string target_uri = 1;
  repeated MembershipPatch documents = 2;
}

message TransferDocument {
  string document_id = 1;
  repeated string corpus_ids = 2;
  bytes xmi = 3;
}

message MembershipPatch {
  string document_id = 1;
  repeated string corpus_ids = 2;
  MembershipOperation operation = 3;
}

message GetTransportJobRequest {
  string job_id = 1;
}

message TransportJob {
  string job_id = 1;
  TransportJobStatus status = 2;
  string operation = 3;
  uint32 document_count = 4;
  string source = 5;
  string target = 6;
  string message = 7;
  uint64 created_epoch_ms = 8;
  uint64 finished_epoch_ms = 9;
}

enum TransportJobStatus {
  TRANSPORT_JOB_STATUS_UNSPECIFIED = 0;
  TRANSPORT_JOB_ACCEPTED = 1;
  TRANSPORT_JOB_RUNNING = 2;
  TRANSPORT_JOB_SUCCEEDED = 3;
  TRANSPORT_JOB_FAILED = 4;
}

enum MembershipOperation {
  MEMBERSHIP_OPERATION_UNSPECIFIED = 0;
  MEMBERSHIP_ATTACH = 1;
  MEMBERSHIP_DETACH = 2;
}
